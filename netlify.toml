# Netlify builds the public site from GitHub.
[build]
  command = "sh scripts/build.sh"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/members"
  to = "/members.html"
  status = 200

[[headers]]
  for = "/members"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/membership-test"
  to = "/members?demo=1&view=library"
  status = 302
