name: Membership checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 13 * * *'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:membership
      - name: Check live membership
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:membership
        env:
          MEMBERSHIP_TEST_URL: https://divinelighthealing-lifecoach.com
